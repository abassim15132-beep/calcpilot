<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CalcPilot — Smart Tools for Students</title>
  <meta name="description" content="Free calculators, student tools, AI utilities and productivity tools in one place.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #07111f;
      --bg2: #0b1728;
      --card: rgba(255,255,255,.06);
      --card-hover: rgba(255,255,255,.10);
      --border: rgba(255,255,255,.10);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #6366f1;
      --secondary: #06b6d4;
      --green: #22c55e;
      --shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(99,102,241,.20), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(6,182,212,.15), transparent 28%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
    }

    /* NAVBAR */

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(18px);
      background: rgba(7,17,31,.72);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -.5px;
