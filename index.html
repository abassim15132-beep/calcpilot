<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CalcPilot - Free online calculators, AI tools, student tools and productivity tools.">
<meta name="keywords" content="calculator, GPA calculator, percentage calculator, BMI calculator, AI tools, student tools">
<meta name="theme-color" content="#0f172a">
<title>CalcPilot — Free Tools That Make Life Easier</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#f7f9fc;
    --card:#ffffff;
    --text:#101828;
    --muted:#667085;
    --border:#e4e7ec;
    --primary:#635bff;
    --primary2:#8b5cf6;
    --soft:#eef2ff;
    --shadow:0 10px 35px rgba(16,24,40,.07);
}

body.dark{
    --bg:#080b14;
    --card:#111827;
    --text:#f8fafc;
    --muted:#98a2b3;
    --border:#263041;
    --soft:#1b2140;
    --shadow:0 10px 35px rgba(0,0,0,.25);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    transition:.25s;
}

a{
    color:inherit;
    text-decoration:none;
}

button,input,textarea{
    font:inherit;
}

/* NAVBAR */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    backdrop-filter:blur(18px);
    background:rgba(247,249,252,.82);
    border-bottom:1px solid var(--border);
}

body.dark .navbar{
    background:rgba(8,11,20,.82);
}

.nav-inner{
    max-width:1180px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:900;
    letter-spacing:-.5px;
}

.logo-icon{
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:12px;
    color:white;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    box-shadow:0 8px 20px rgba(99,91,255,.28);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:25px;
    color:var(--muted);
    font-size:14px;
    font-weight:600;
}

.nav-links a:hover{
    color:var(--primary);
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:12px;
    cursor:pointer;
    display:grid;
    place-items:center;
}

.menu-btn{
    display:none;
}

/* HERO */

.hero{
    max-width:1180px;
    margin:auto;
    padding:85px 20px 60px;
    text-align:center;
    position:relative;
}

.hero::before{
    content:"";
    position:absolute;
    width:500px;
    height:300px;
    background:rgba(99,91,255,.13);
    filter:blur(100px);
    border-radius:50%;
    top:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:-1;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 13px;
    border-radius:999px;
    background:var(--soft);
    color:var(--primary);
    font-size:13px;
    font-weight:800;
    margin-bottom:22px;
}

.badge span{
    width:7px;
    height:7px;
    background:#22c55e;
    border-radius:50%;
    box-shadow:0 0 0 5px rgba(34,197,94,.12);
}

.hero h1{
    font-size:clamp(42px,7vw,76px);
    line-height:1.03;
    letter-spacing:-4px;
    max-width:900px;
    margin:auto;
    font-weight:950;
}

.gradient{
    background:linear-gradient(100deg,#635bff,#a855f7,#ec4899);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero p{
    max-width:680px;
    margin:22px auto 30px;
    color:var(--muted);
    font-size:18px;
}

.search-box{
    max-width:650px;
    margin:30px auto 0;
    position:relative;
}

.search-box input{
    width:100%;
    height:62px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:18px;
    padding:0 60px 0 22px;
    outline:none;
    box-shadow:var(--shadow);
    font-size:16px;
}

.search-box input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(99,91,255,.1);
}

.search-icon{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    font-size:22px;
}

/* SECTIONS */

.section{
    max-width:1180px;
    margin:auto;
    padding:45px 20px;
}

.section-head{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:22px;
}

.section-title{
    font-size:30px;
    letter-spacing:-1px;
    font-weight:900;
}

.section-subtitle{
    color:var(--muted);
    margin-top:4px;
}

.view-all{
    color:var(--primary);
    font-weight:800;
    font-size:14px;
}

/* CATEGORY */

.categories{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:28px;
}

.category{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    padding:9px 15px;
    border-radius:999px;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
    transition:.2s;
}

.category:hover,
.category.active{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

/* CARDS */

.tools-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.tool-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
    box-shadow:0 5px 20px rgba(16,24,40,.03);
    transition:.25s;
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

.tool-card::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    background:rgba(99,91,255,.08);
    border-radius:50%;
    right:-45px;
    top:-45px;
}

.tool-card:hover{
    transform:translateY(-5px);
    box-shadow:var(--shadow);
    border-color:rgba(99,91,255,.35);
}

.tool-icon{
    width:48px;
    height:48px;
    border-radius:14px;
    display:grid;
    place-items:center;
    font-size:23px;
    background:var(--soft);
    margin-bottom:17px;
}

.tool-card h3{
    font-size:17px;
    margin-bottom:5px;
}

.tool-card p{
    color:var(--muted);
    font-size:13px;
    min-height:42px;
}

.tool-link{
    margin-top:15px;
    display:inline-block;
    color:var(--primary);
    font-size:13px;
    font-weight:800;
}

/* AI */

.ai-section{
    max-width:1180px;
    margin:45px auto;
    padding:0 20px;
}

.ai-box{
    border-radius:30px;
    padding:55px;
    background:
        radial-gradient(circle at 90% 10%,rgba(236,72,153,.25),transparent 35%),
        radial-gradient(circle at 10% 90%,rgba(99,91,255,.25),transparent 35%),
        linear-gradient(135deg,#10152b,#17102c);
    color:white;
    position:relative;
    overflow:hidden;
}

.ai-box .badge{
    background:rgba(255,255,255,.1);
    color:#ddd6fe;
}

.ai-box h2{
    font-size:42px;
    line-height:1.1;
    letter-spacing:-2px;
    max-width:650px;
}

.ai-box > p{
    color:#b9bfd1;
    max-width:650px;
    margin:15px 0 30px;
}

.ai-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.ai-card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    padding:18px;
    backdrop-filter:blur(10px);
}

.ai-card h3{
    font-size:15px;
}

.ai-card p{
    color:#aeb5c8;
    font-size:12px;
    margin-top:4px;
}

/* TOOL DEMO */

.demo{
    max-width:1180px;
    margin:20px auto 60px;
    padding:0 20px;
}

.demo-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:25px;
    padding:30px;
    box-shadow:var(--shadow);
}

.demo-head{
    margin-bottom:20px;
}

    font-size:26px;
}
